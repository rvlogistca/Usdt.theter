<div class="usdt-card">
  <img
    src="./usdt-icon.svg"
    alt="USDT"
    class="usdt-logo"
  >

  <div class="usdt-info">
    <h3>USDT</h3>
    <span>Tether USD • Stablecoin</span>

    <div class="wallet-box">
      <p class="wallet-label">Carteira:</p>
      <code id="walletAddress">
        0x26Ef6c3AF50240F211E774213914f8DB526fA77d
      </code>
      <button onclick="copyWallet()" title="Copiar carteira">📋</button>
    </div>

    <div class="contract-box">
      <p class="contract-label">Contrato do Token:</p>
      <code id="usdtAddress">
        0x4644E1113FE1a6bA831D85cc4772b3D0c23DE655
      </code>
      <button onclick="copyUSDT()" title="Copiar contrato">📋</button>
    </div>

    <div class="usdt-buttons">
      <button onclick="addUSDT()" class="wallet-btn">
        🦊 Adicionar USDT à carteira
      </button>
      <a
        href="https://etherscan.io/token/0x4644E1113FE1a6bA831D85cc4772b3D0c23DE655"
        target="_blank"
        class="explorer-btn"
      >
        Ver no Etherscan
      </a>
    </div>
  </div>
</div>

<script>
const USDT = {
  walletAddress: "0x26Ef6c3AF50240F211E774213914f8DB526fA77d",
  contractAddress: "0x4644E1113FE1a6bA831D85cc4772b3D0c23DE655",
  symbol: "USDT",
  decimals: 6,
  chainId: "0x1",
  image: window.location.origin + "/usdt-icon.svg"
};

async function copyWallet() {
  await navigator.clipboard.writeText(USDT.walletAddress);
  alert("0x26Ef6c3AF50240F211E774213914f8DB526fA77d");
}

async function copyUSDT() {
  await navigator.clipboard.writeText(USDT.contractAddress);
  alert("✅ Contrato USDT copiado!");
}

async function addUSDT() {
  if (!window.ethereum) {
    alert("⚠️ Instale o MetaMask ou outra carteira Web3 primeiro.");
    return;
  }

  try {
    const added = await window.ethereum.request({
      method: "wallet_watchAsset",
      params: {
        type: "ERC20",
        options: {
          address: USDT.contractAddress,
          symbol: USDT.symbol,
          decimals: USDT.decimals,
          image: USDT.image
        }
      }
    });
    if (added) console.log("✅ USDT adicionado à carteira!");
  } catch (err) {
    console.error(err);
    alert("❌ Erro ao adicionar USDT.");
  }
}
</script>
