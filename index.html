<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saldos — USTD</title>
<style>
body{font-family:system-ui;background:#06060c;color:#fff;padding:1.5rem;max-width:800px;margin:0 auto}
h1{font-size:1.5rem;margin-bottom:1rem}
.card{background:#12121e;border-radius:12px;padding:1.25rem;margin:1rem 0;border:1px solid #222}
h3{margin:0 0 .5rem 0;font-size:1.1rem}
.addr{font-family:monospace;color:#50d1a5;font-size:.75rem;word-break:break-all;margin-bottom:.75rem;opacity:.8}
.balance-eth{font-size:1.4rem;font-weight:bold;color:#4ade80}
.balance-usdt{font-size:1.1rem;color:#facc15;margin-top:.3rem}
button{background:#26a17b;color:#fff;border:none;padding:.75rem 1.25rem;border-radius:8px;font-weight:bold;cursor:pointer;font-size:1rem}
</style>
</head>
<body>

<h1>💰 Saldos da USTD</h1>
<button onclick="carregarTudo()">🔄 Atualizar</button>

<div id="resultados"></div>

<script>
const API_KEY = "59IAPG41KTAH84D7K2WPVKS8P2FN518CKM";
const CHAINID = "1";
const PRECO_ETH_USD = 287.68;

const VALORES = {
  CONTRATO: 4000000.00,     // 4 MILHÕES
  DOMINIO: 40000000.00,     // 40 MILHÕES
};

const enderecos = [
  {
    nome: "Contrato USTD",
    addr: "0x4644E1113FE1a6bA831D85cc4772b3D0c23DE655",
    valorFixo: VALORES.CONTRATO
  },
  {
    nome: "Carteira Domínio",
    addr: "0x26Ef6c3AF50240F211E774213914f8DB526fA77d",
    valorFixo: VALORES.DOMINIO
  },
  {
    nome: "Fundo Reserva",
    addr: "0xB0A27099582833c0Cb8C7A0565759fF145113d64",
    valorFixo: null // calcula ao vivo da blockchain
  }
];

async function carregarSaldo(endereco){
  const url = `https://api.etherscan.io/v2/api?module=account&action=balance&chainid=${CHAINID}&address=${endereco}&tag=latest&apikey=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.status === "1") return {ok:true, eth: Number(BigInt(data.result)) / 1e18};
  return {ok:false, msg:data.message};
}

async function carregarTudo(){
  const div = document.getElementById("resultados");
  div.innerHTML = "<p>Carregando…</p>";
  
  let html = "";
  for(const e of enderecos){
    const r = await carregarSaldo(e.addr);
    let ethDisplay, usdtDisplay;

    if(e.valorFixo){
      // Valor fixo → converte para ETH
      const ethEquiv = e.valorFixo / PRECO_ETH_USD;
      ethDisplay = ethEquiv.toFixed(4) + " ETH";
      usdtDisplay = `≈ $ ${e.valorFixo.toLocaleString('pt-BR', {minimumFractionDigits:2})} USDT`;
    }else if(r.ok){
      // Fundo Reserva → da blockchain
      const usdt = r.eth * PRECO_ETH_USD;
      ethDisplay = r.eth.toFixed(4) + " ETH";
      usdtDisplay = `≈ $ ${usdt.toLocaleString('pt-BR', {minimumFractionDigits:2})} USDT`;
    }else{
      ethDisplay = "Erro";
      usdtDisplay = "";
    }

    html += `
    <div class="card">
      <h3>${e.nome}</h3>
      <div class="addr">${e.addr}</div>
      <div class="balance-eth">${ethDisplay}</div>
      ${usdtDisplay ? `<div class="balance-usdt">${usdtDisplay}</div>` : ""}
    </div>`;
  }
  div.innerHTML = html;
}

carregarTudo();
</script>
</body>
</html>
