<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063d2e">
  <meta name="description" content="USTD — token na Ethereum Mainnet.">
  <title>USTD | Ethereum Token</title>
  <link rel="icon" type="image/svg+xml" href="./ustd-icon.svg">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="coin-wrap">
        <img src="./ustd-icon.svg" alt="USTD" class="coin">
      </div>

      <div class="hero-copy">
        <span class="eyebrow">ETHEREUM MAINNET</span>
        <h1>USTD</h1>
        <p class="subtitle">Digital Token</p>
        <p class="description">
          Informações do contrato, endereço e integração com carteira.
        </p>
      </div>
    </section>

    <section class="card">
      <div class="token-head">
        <img src="./ustd-icon.svg" alt="" class="mini-logo">
        <div>
          <h2>USTD</h2>
          <span>ERC-20 • Ethereum</span>
        </div>
        <span class="network-badge">MAINNET</span>
      </div>

      <div class="contract">
        <label>Endereço do contrato</label>
        <div class="address-row">
          <code id="contractAddress">0x4644E1113FE1a6bA831D85cc4772b3D0c23DE655</code>
          <button id="copyBtn" class="icon-btn" type="button" title="Copiar contrato" aria-label="Copiar contrato">⧉</button>
        </div>
        <small id="copyStatus" aria-live="polite"></small>
      </div>

      <div class="details">
        <div><span>Rede</span><strong>Ethereum</strong></div>
        <div><span>Padrão</span><strong>ERC-20</strong></div>
        <div><span>Símbolo</span><strong>USTD</strong></div>
        <div><span>Decimais</span><strong>18</strong></div>
      </div>

      <div class="actions">
        <button id="addWalletBtn" class="primary-btn" type="button">
          🦊 Adicionar USTD à carteira
        </button>

        <a
          class="secondary-btn"
          href="https://etherscan.io/token/0x4644E1113FE1a6bA831D85cc4772b3D0c23DE655"
          target="_blank"
          rel="noopener noreferrer">
          Ver contrato no Etherscan ↗
        </a>
      </div>

      <p id="walletStatus" class="status" aria-live="polite"></p>
    </section>

    <footer>
      <span>USTD</span>
      <span>•</span>
      <span>Ethereum Mainnet</span>
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
